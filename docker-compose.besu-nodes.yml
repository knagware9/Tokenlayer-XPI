# ─────────────────────────────────────────────────────────────────────────
# Hyperledger Besu — 5-Node QBFT DEV network (vendored in-repo).
# Started via `make besu-up` (docker compose -f docker-compose.besu-nodes.yml up -d).
#
# Config lives in ./infra/besu-network/ (genesis, node keys, static-nodes.json).
# DEV ONLY: the node keys and the pre-funded genesis key are committed —
# see infra/besu-network/README.md. Never use on a production network.
#
# Peer discovery via static-nodes.json (no bootnode dependency).
# Each node gets a fixed IP on 172.16.239.0/24 matching the static-nodes file.
# Node 1 exposes port 8545 to the host; nodes 2-5 are internal.
# The TokenLayer stack joins the `besu-network` docker network through the
# docker-compose.besu.yml overlay and reaches the RPC at besu-node1:8545.
# ─────────────────────────────────────────────────────────────────────────
services:

  besu-node1:
    image: hyperledger/besu:24.12.0
    container_name: besu-node1
    volumes:
      - besu-node1-data:/data
      - ./infra/besu-network/genesis.json:/config/genesis.json:ro
      - ./infra/besu-network/node1/key:/config/nodekey:ro
      - ./infra/besu-network/static-nodes.json:/config/static-nodes.json:ro
    command:
      - --data-path=/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/nodekey
      - --static-nodes-file=/config/static-nodes.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,QBFT,WEB3,TXPOOL
      - --host-allowlist=*
      - --p2p-enabled=true
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --min-gas-price=0
      - --revert-reason-enabled=true
      - --logging=INFO
    ports:
      - "8545:8545"
    networks:
      besu-network:
        ipv4_address: 172.16.239.11
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - >-
          exec 3<>/dev/tcp/localhost/8545;
          printf 'POST / HTTP/1.0\r\nHost: localhost\r\nContent-Type: application/json\r\nContent-Length: 49\r\n\r\n{"jsonrpc":"2.0","method":"net_peerCount","id":1}' >&3;
          grep -q '"result":"0x[1-9a-f]' <(cat <&3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

