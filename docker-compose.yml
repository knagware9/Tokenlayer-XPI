# TokenLayer — self-host stack (API + Web).
# Usage:
#   cp .env.example .env   # then set a strong JWT_SECRET (openssl rand -hex 32)
#   docker compose up --build
# Web:  http://localhost:8080
# API:  http://localhost:4000  (Swagger UI at /docs)
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "4000"
      NODE_ENV: production
      # SQLite lives on a named volume so data survives container restarts.
      DATABASE_URL: "file:/data/dev.db"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example) — e.g. openssl rand -hex 32}
      # Allow the web origin to call the API (CORS).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Simulated-only stack: boot without the required besu chain (absent, never mocked).
      CHAIN_STRICT: "0"
      # Secondary market (escrowed listings) + marketplace/issuance fee sink. System
      # addresses exempt from holder rules; enable the DvP marketplace for the demo.
      MARKET_ESCROW_ACCOUNT: ${MARKET_ESCROW_ACCOUNT:-0x000000000000000000000000000000000000E5C0}
      PLATFORM_FEE_ACCOUNT: ${PLATFORM_FEE_ACCOUNT:-0x000000000000000000000000000000000000FEE5}
      # Shared demo: many users authenticate from one egress IP — raise the
      # per-IP login throttle above the secure default (10).
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-200}
      # DID/VC KYC: trusted issuer DID allowlist (empty ⇒ verification closed) + a
      # dev-only issuer seed enabling POST /identity/mint for the demo. From .env.
      TRUSTED_KYC_ISSUERS: ${TRUSTED_KYC_ISSUERS:-}
      DEV_KYC_ISSUER_SEED: ${DEV_KYC_ISSUER_SEED:-}
      # REQUIRED: NODE_ENV is hardcoded to "production" above, and env.ts now
      # refuses to boot in production without this set — an unset token means
      # GET /metrics is open with no authentication on this container's
      # publicly-published port. Not defaulted, like JWT_SECRET/DID_MASTER_KEY.
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env (see .env.example) — e.g. openssl rand -hex 32}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Distributed tracing: unset OTEL_EXPORTER_OTLP_ENDPOINT ⇒ a total no-op,
      # same posture as SENTRY_DSN. Set it (e.g. to a Tempo instance from the
      # observability overlay: http://tempo:4318) to enable it.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tokenlayer-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Organizations hold custodial DID seeds, encrypted at rest under this
      # key. REQUIRED, like the split stacks require it, and not defaulted to
      # empty: an unset key does not degrade the platform gracefully, it makes
      # every organization — and so every credential, registry anchor and
      # corporate signup — fail at creation. `make deploy` generates one into
      # .env when absent. Never rotate it for a deployment that already has
      # organizations; the seeds are unrecoverable under a new key.
      DID_MASTER_KEY: ${DID_MASTER_KEY:?Set DID_MASTER_KEY — organization DID seeds are encrypted with it (make deploy generates one)}
    volumes:
      - api-data:/data
    ports:
      - "${API_PORT:-4000}:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Where the browser reaches the API (host-published port).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:

networks:
  default:
    name: tokenlayer-main
