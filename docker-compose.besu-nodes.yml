# Fixed-name bridge network with static IPs — required by static-nodes.json.
# Subnet 172.16.239.0/24: node1=.11, node2=.12, node3=.13, node4=.14, node5=.15
# The docker-compose.besu.yml overlay attaches the api to this network by name.
networks:
  besu-network:
    name: besu-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24
