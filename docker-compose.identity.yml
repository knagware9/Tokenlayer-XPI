# ═════════════════════════════════════════════════════════════════════════════
# THE IDENTITY STACK — one API, three audience apps.
#
#   bash scripts/stack-up.sh identity          (or: identity + tokenization)
#
#   identity-api ────┬── identity-issuer-edge   ── identity-issuer-web    :8090
#   (identity-data)  ├── identity-verifier-edge ── identity-verifier-web  :8091
#                    └── identity-holder-edge   ── identity-holder-web    :8092
#
# THIS FILE STANDS ALONE. Bring it up with nothing else running and you have a
# working digital-identity product: authorities issue, relying parties verify,
# people hold. It has no dependency on tokenization in either direction — the
# arrow between the products points the other way, and only at runtime (the
# tokenization API asks THIS one whether a subject holds a credential).
#
# ── THE SHARED NETWORK ───────────────────────────────────────────────────────
#
# `xi-net` is declared external so the two stacks can be started in either
# order, from separate directories, or on separate schedules, and still find
# each other by service name. Create it once:
#
#   docker network create xi-net
#
# scripts/stack-up.sh does that for you. Declaring it external rather than
# letting compose auto-create a per-project network is the whole reason these
# two files can be independent: an auto-created network is named after the
# project, so tokenization-api would resolve `identity-api` only when both lived
# in the same compose project — which is exactly the coupling being removed.
#
# NEITHER API PUBLISHES A HOST PORT. The three edges are the only way in.
#
# One API serves all three personas here, and the reason is recorded where
# someone would go to change it: see "WHY EACH PRODUCT KEEPS ONE API" at the top
# of packages/core/src/personas.ts.
# ═════════════════════════════════════════════════════════════════════════════

x-edge-build: &edge-build
  context: .
  dockerfile: apps/edge/Dockerfile

x-web-build: &web-build
  context: .
  dockerfile: apps/web/Dockerfile

services:
  identity-api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: "file:/data/identity.db"
      ENABLED_DOMAINS: identity
      # PERSONAS_-prefixed and NOT just JWT_SECRET/DID_MASTER_KEY: the repo root
      # also has a plain `.env` for the single-stack docker-compose.yml, with
      # its OWN, different JWT_SECRET/DID_MASTER_KEY. Compose auto-loads that
      # `.env` for ANY compose invocation in this directory, including a bare
      # `docker compose -f docker-compose.identity.yml up` that skips
      # scripts/stack-up.sh. Sharing the plain names let that shortcut silently
      # boot identity-api with the single-stack's secrets — wrong JWT_SECRET
      # (invalidates every session) and wrong DID_MASTER_KEY (undecryptable
      # custodial seeds) — with no error. The distinct name means that shortcut
      # now fails loudly instead, via the `:?` guard below.
      JWT_SECRET: ${PERSONAS_JWT_SECRET:?Set PERSONAS_JWT_SECRET in .env.personas — start via scripts/stack-up.sh, not a direct docker compose call}
      DID_MASTER_KEY: ${PERSONAS_DID_MASTER_KEY:?Set PERSONAS_DID_MASTER_KEY in .env.personas — start via scripts/stack-up.sh, not a direct docker compose call}
      # Every persona web app that talks to this product, and no others.
      CORS_ORIGINS: ${IDENTITY_WEB_ORIGINS:-http://localhost:8090,http://localhost:8091,http://localhost:8092}
      CHAIN_STRICT: ${CHAIN_STRICT:-0}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-200}
      # `env.ts` itself defaults this to "besu" when the var is UNSET — but an
      # env var explicitly set to "" is not unset, so the empty fallback this
      # line used to have defeated that default: identity-api booted saying
      # "chain '' is absent" and issued every credential unanchored, even with
      # --chain=besu supplying a live BESU_RPC_URL right below. Match the
      # code's own default here so the two agree.
      REGISTRY_CHAIN_ID: ${REGISTRY_CHAIN_ID:-besu}
      MST_RPC_URL: ${MST_RPC_URL:-}
      MST_OPERATOR_KEY: ${MST_OPERATOR_KEY:-}
      BESU_RPC_URL: ${BESU_RPC_URL:-}
      BESU_OPERATOR_KEY: ${BESU_OPERATOR_KEY:-}
      # Also PERSONAS_-prefixed: unlike the two guards above this one degrades
      # silently (empty ⇒ fail-closed, no issuer trusted) rather than refusing
      # to boot, so picking up the single-stack .env's unrelated demo-issuer
      # DID by accident would be a quiet correctness bug, not a loud one.
      TRUSTED_KYC_ISSUERS: ${PERSONAS_TRUSTED_KYC_ISSUERS:-}
      DEV_KYC_ISSUER_SEED: ${DEV_KYC_ISSUER_SEED:-}
      # Error tracking (Sentry). Unset (the default) is a total no-op — see
      # apps/api/src/shared/observability.ts.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    volumes: [identity-data:/data]
    networks: [xi-net]
    restart: unless-stopped
    # A raw HTTP GET, not a dedicated route: the API has none, every real route
    # needs auth, and ANY response (even a 401) proves Fastify is up and
    # routing — that's the bar a liveness check needs to clear.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  identity-issuer-edge:
    build: { <<: *edge-build, args: { PERSONA: identity-issuer } }
    ports: ["${IDENTITY_ISSUER_API_PORT:-4110}:80"]
    depends_on: [identity-api]
    networks: [xi-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  identity-verifier-edge:
    build: { <<: *edge-build, args: { PERSONA: identity-verifier } }
    ports: ["${IDENTITY_VERIFIER_API_PORT:-4111}:80"]
    depends_on: [identity-api]
    networks: [xi-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  identity-holder-edge:
    build: { <<: *edge-build, args: { PERSONA: identity-holder } }
    ports: ["${IDENTITY_HOLDER_API_PORT:-4112}:80"]
    depends_on: [identity-api]
    networks: [xi-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  identity-issuer-web:
    build:
      <<: *web-build
      args:
        VITE_API_URL: ${IDENTITY_ISSUER_API_URL:-http://localhost:4110}
        VITE_APP_PERSONA: identity-issuer
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
    ports: ["${IDENTITY_ISSUER_WEB_PORT:-8090}:80"]
    depends_on: [identity-issuer-edge]
    networks: [xi-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  identity-verifier-web:
    build:
      <<: *web-build
      args:
        VITE_API_URL: ${IDENTITY_VERIFIER_API_URL:-http://localhost:4111}
        VITE_APP_PERSONA: identity-verifier
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
    ports: ["${IDENTITY_VERIFIER_WEB_PORT:-8091}:80"]
    depends_on: [identity-verifier-edge]
    networks: [xi-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  identity-holder-web:
    build:
      <<: *web-build
      args:
        VITE_API_URL: ${IDENTITY_HOLDER_API_URL:-http://localhost:4112}
        VITE_APP_PERSONA: identity-holder
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-}
    ports: ["${IDENTITY_HOLDER_WEB_PORT:-8092}:80"]
    depends_on: [identity-holder-edge]
    networks: [xi-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  identity-data:

networks:
  xi-net:
    external: true
