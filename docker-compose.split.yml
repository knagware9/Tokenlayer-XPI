# TokenLayer XPI — THE SPLIT TOPOLOGY: two products, two deployments.
#
#   docker compose -f docker-compose.split.yml up --build      (or: make deploy-split)
#
# Identity  → API :4100, web :8081, its own database volume
# Tokenize  → API :4000, web :8080, its own database volume
#
# This is NOT an overlay on docker-compose.yml. It is the alternative to it: the
# combined stack is one deployment serving both products, this is two
# deployments serving one each, and mixing the files would produce a third thing
# nobody chose.
#
# WHAT MAKES IT THE REAL SPLIT, not two copies of the same app:
#
#   · SEPARATE VOLUMES. Each service keeps only the tables it owns plus the
#     shared ones (`/// domain:` in prisma/schema.prisma). Pointing both at one
#     database would pass every check here and prove nothing.
#   · ENABLED_DOMAINS names one product each, so the other's routes answer 404.
#   · The tokenization API asks the identity API "does this DID hold a valid
#     KycCredential?" over HTTP and NOTHING ELSE. IDENTITY_SERVICE_KEY is a peer
#     API key minted on the identity deployment AT RUN TIME — it cannot be baked
#     in, which is why `scripts/deploy-split.sh` exists rather than a static
#     compose value. Bring this up by hand and you must supply it yourself.
services:
  identity-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: "file:/data/identity.db"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example) — e.g. openssl rand -hex 32}
      CORS_ORIGINS: ${IDENTITY_WEB_ORIGIN:-http://localhost:8081}
      ENABLED_DOMAINS: identity
      CHAIN_STRICT: "0"
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-200}
      TRUSTED_KYC_ISSUERS: ${TRUSTED_KYC_ISSUERS:-}
      DEV_KYC_ISSUER_SEED: ${DEV_KYC_ISSUER_SEED:-}
    volumes:
      - identity-data:/data
    ports:
      - "${IDENTITY_API_PORT:-4100}:4000"
    restart: unless-stopped

  identity-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${IDENTITY_API_URL:-http://localhost:4100}
    ports:
      - "${IDENTITY_WEB_PORT:-8081}:80"
    depends_on:
      - identity-api
    restart: unless-stopped

  tokenization-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: "file:/data/tokenization.db"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example) — e.g. openssl rand -hex 32}
      CORS_ORIGINS: ${TOKENIZATION_WEB_ORIGIN:-http://localhost:8080}
      ENABLED_DOMAINS: tokenization
      CHAIN_STRICT: "0"
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-200}
      MARKET_ESCROW_ACCOUNT: ${MARKET_ESCROW_ACCOUNT:-0x000000000000000000000000000000000000E5C0}
      PLATFORM_FEE_ACCOUNT: ${PLATFORM_FEE_ACCOUNT:-0x000000000000000000000000000000000000FEE5}
      # The whole seam, in two variables. Container-to-container, so the host
      # port is irrelevant here. Set BOTH or the API refuses to boot.
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-api:4000/api/v1}
      IDENTITY_SERVICE_KEY: ${IDENTITY_SERVICE_KEY:?Mint a peer key with the identity:assert scope on the identity deployment — scripts/deploy-split.sh does this for you}
    volumes:
      - tokenization-data:/data
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      - identity-api
    restart: unless-stopped

  tokenization-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - tokenization-api
    restart: unless-stopped

volumes:
  identity-data:
  tokenization-data:
