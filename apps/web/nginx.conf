server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness for compose healthchecks — same shape as the persona edges' own
  # /healthz (deploy/persona-edges/*.conf), answered by nginx itself so it
  # never depends on the SPA fallback below or the build it's currently serving.
  location = /healthz {
    default_type application/json;
    return 200 '{"ok":true}';
  }

  # SPA: route every unknown path back to index.html so client routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets; never cache the HTML shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
