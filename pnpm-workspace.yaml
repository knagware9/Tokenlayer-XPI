packages:
  - "packages/*"
  - "apps/*"
# Dependencies allowed to run postinstall build scripts (pnpm 11 blocks the rest).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  keccak: true
  # HSM binding — native build not needed; we use filesystem wallets, not PKCS#11.
  pkcs11js: false
  prisma: true
  # protobufjs works via its JS fallback; the postinstall codegen is optional.
  protobufjs: false
  secp256k1: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.69.0'
  - '@typescript-eslint/parser@8.69.0'
  - '@typescript-eslint/project-service@8.69.0'
  - '@typescript-eslint/scope-manager@8.69.0'
  - '@typescript-eslint/tsconfig-utils@8.69.0'
  - '@typescript-eslint/type-utils@8.69.0'
  - '@typescript-eslint/types@8.69.0'
  - '@typescript-eslint/typescript-estree@8.69.0'
  - '@typescript-eslint/utils@8.69.0'
  - '@typescript-eslint/visitor-keys@8.69.0'
  - typescript-eslint@8.69.0
